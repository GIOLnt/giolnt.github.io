<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One garment, three cities — GL</title>
  <!-- pagina privata: nessun link dal resto del sito, invisibile ai motori di ricerca -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #050505; --fg: #f2efe9; --muted: #8a867f; --line: rgba(242, 239, 233, 0.14); --accent: #d9b26b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--fg); }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: clamp(24px, 5vh, 56px) 16px 32px; font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(120% 90% at 50% 10%, #1d1b18 0%, #0b0b0b 55%, #050505 100%);
    }
    .kicker { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); }
    h1 { font-family: 'Bebas Neue', 'Arial Narrow', sans-serif; font-weight: 400; font-size: clamp(40px, 7vw, 72px); line-height: .95; letter-spacing: .02em; margin-top: 10px; text-align: center; }
    .cities { margin-top: 8px; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .frame { margin-top: 28px; width: min(420px, 100%, calc((100vh - 230px) * 9 / 16)); min-width: 260px; aspect-ratio: 9 / 16; border: 1px solid var(--line); background: #000; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .note { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
    footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); width: min(420px, 100%); text-align: center; font-size: 13px; color: var(--muted); }
    footer a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 2px; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <p class="kicker">Private preview</p>
  <h1>One garment, three cities</h1>
  <p class="cities">Venice · Paris · New York</p>

  <div class="frame">
    <video src="film.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <p class="note">37 s · vertical 9:16 · made entirely with AI</p>

  <footer>
    More work: <a href="https://giolnt.github.io/">giolnt.github.io</a>
  </footer>
</body>
</html>
